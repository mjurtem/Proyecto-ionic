<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de coches
    </ion-title>
      <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<!-- <app-app-header></app-app-header> -->

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de coches</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Contenido para añadir en: src/app/home/home.page.html (dentro de ion-content) -->

<!-- FORMULARIO PARA AÑADIR TAREAS -->
<ion-list>
  <ion-item>
    <ion-input label="Marca" label-placement="floating" [(ngModel)]="nuevoCoche.marca"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Modelo" label-placement="floating" [(ngModel)]="nuevoCoche.modelo"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Año" type="number" label-placement="floating" [(ngModel)]="nuevoCoche.anno"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Km" type="number" label-placement="floating" [(ngModel)]="nuevoCoche.km"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Precio" type="number" label-placement="floating" [(ngModel)]="nuevoCoche.precio"></ion-input>
  </ion-item>
  <ion-item><ion-toggle [(ngModel)]="nuevoCoche.itv">ITV</ion-toggle></ion-item>
  <ion-item><ion-toggle [(ngModel)]="nuevoCoche.seguro">Seguro</ion-toggle></ion-item>
  <ion-item><ion-toggle [(ngModel)]="nuevoCoche.disponible">Disponible</ion-toggle></ion-item>
</ion-list>

<ion-button expand="block" (click)="agregarCoche()" class="ion-margin-top ion-margin-bottom">
  Añadir coche
</ion-button>

  <ion-grid>
    <ion-row>
      <ion-col *ngFor="let coche of catalogo" size="6" size-md="4">
        <!-- 
          Directiva *ngFor: este es el bucle. 
          - Por cada objeto 'coche' que haya en el array 'catalogo'...
          - ...Angular creará una instancia de nuestro componente <app-car-item>.
        -->
        <app-car-item
          [coche]="coche">
          <!-- Property Binding: le pasamos el objeto 'coche' actual al @Input del componente hijo -->
        </app-car-item>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Directiva *ngIf: este div solo existirá en el DOM si la condición es verdadera -->
  <div *ngIf="catalogo.length === 0" class="mensaje-vacio">
    <p>¡Enhorabuena!</p>
    <p>No tienes coches en el catálogo.</p>
  </div>
</ion-content>
